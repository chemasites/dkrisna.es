# Publish direct changes and successful Booksy synchronizations.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Update Services from Booksy, Update Reviews from Booksy]
    types: [completed]
    branches: [main]

name: Build and deploy GH Pages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # The sync commits data after its triggering SHA; build current main.
          ref: main

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.21.0

      - name: Build with Zola
        env:
          ZOLA_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          zola build
          python3 scripts/check-seo.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
