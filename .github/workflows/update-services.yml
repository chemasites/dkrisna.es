name: Update Services from Booksy

on:
  schedule:
    # Run every night at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-services:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      - name: Install Playwright browsers
        run: |
          cd scripts
          npx playwright install chromium

      - name: Fetch and update services
        run: |
          cd scripts
          node fetch-booksy.js

      - name: Build site to verify
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.19.2

      - name: Verify build
        run: zola build

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet content/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add content/
          git commit -m "chore: update services from Booksy"
          git push
