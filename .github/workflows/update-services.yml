name: Update Services from Booksy

on:
  schedule:
    # Run every night at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-services:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      - name: Install Playwright browsers
        run: |
          cd scripts
          npx playwright install chromium
          npx playwright install-deps chromium

      - name: Get stored content hash
        id: stored
        run: |
          STORED_HASH=$(node -e "
            const fs = require('fs');
            try {
              const data = JSON.parse(fs.readFileSync('static/data/services.json', 'utf-8'));
              console.log(data.contentHash || '');
            } catch { console.log(''); }
          ")
          echo "hash=$STORED_HASH" >> $GITHUB_OUTPUT
          echo "Stored content hash: $STORED_HASH"

      - name: Fetch and update services
        run: |
          cd scripts
          node fetch-services.js

      - name: Check if translation needed
        id: translation
        run: |
          # Extract translatable content (names and descriptions) and create hash
          CURRENT_HASH=$(node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const data = JSON.parse(fs.readFileSync('static/data/services.json', 'utf-8'));
            const texts = [];
            data.categories.forEach(cat => {
              cat.services.forEach(svc => {
                texts.push(svc.name);
                if (svc.description) texts.push(svc.description);
              });
            });
            console.log(crypto.createHash('sha256').update(texts.sort().join('|')).digest('hex').substring(0, 16));
          ")

          # Get stored hash from existing translations
          STORED_HASH=""
          if [ -f "static/data/services.en.json" ]; then
            STORED_HASH=$(node -e "
              const fs = require('fs');
              try {
                const data = JSON.parse(fs.readFileSync('static/data/services.en.json', 'utf-8'));
                console.log(data.sourceHash || '');
              } catch { console.log(''); }
            ")
          fi

          echo "Current hash: $CURRENT_HASH"
          echo "Stored hash: $STORED_HASH"

          if [ "$CURRENT_HASH" = "$STORED_HASH" ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "No translation needed - content unchanged"
          else
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "Translation needed - content changed"
          fi

      - name: Translate services to English
        if: steps.translation.outputs.needed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd scripts
          node translate-services.js

      - name: Check for content changes
        id: changes
        run: |
          NEW_HASH=$(node -e "
            const fs = require('fs');
            try {
              const data = JSON.parse(fs.readFileSync('static/data/services.json', 'utf-8'));
              console.log(data.contentHash || '');
            } catch { console.log(''); }
          ")
          STORED_HASH="${{ steps.stored.outputs.hash }}"
          echo "Stored hash: $STORED_HASH"
          echo "New hash: $NEW_HASH"

          if [ "$NEW_HASH" = "$STORED_HASH" ] && [ -n "$STORED_HASH" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No content changes detected, skipping commit"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Content changed, will commit"
          fi

      - name: Build site to verify
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.21.0

      - name: Verify build
        run: zola build

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add static/data/
          git commit -m "chore: update services from Booksy"
          git pull --rebase
          git push
