name: Update Reviews from Booksy

on:
  schedule:
    # Run every night at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-reviews:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      - name: Install Playwright browsers
        run: |
          cd scripts
          npx playwright install chromium

      - name: Fetch and update reviews
        run: |
          cd scripts
          node fetch-reviews.js

      - name: Build site to verify
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.21.0

      - name: Verify build
        run: zola build

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet static/data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add static/data/
          git commit -m "chore: update reviews from Booksy"
          git push
