name: Update Reviews from Booksy

on:
  schedule:
    # Run weekly on Monday at 2:00 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-reviews:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      - name: Get stored content hash
        id: stored
        run: |
          STORED_HASH=$(node -e "
            const fs = require('fs');
            try {
              const data = JSON.parse(fs.readFileSync('static/data/booksy-reviews.json', 'utf-8'));
              console.log(data.contentHash || '');
            } catch { console.log(''); }
          ")
          echo "hash=$STORED_HASH" >> $GITHUB_OUTPUT
          echo "Stored content hash: $STORED_HASH"

      - name: Fetch and update reviews
        run: |
          cd scripts
          node fetch-reviews.js

      - name: Build site to verify
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.21.0

      - name: Verify build
        run: zola build

      - name: Check for content changes
        id: changes
        run: |
          NEW_HASH=$(node -e "
            const fs = require('fs');
            try {
              const data = JSON.parse(fs.readFileSync('static/data/booksy-reviews.json', 'utf-8'));
              console.log(data.contentHash || '');
            } catch { console.log(''); }
          ")
          STORED_HASH="${{ steps.stored.outputs.hash }}"
          echo "Stored hash: $STORED_HASH"
          echo "New hash: $NEW_HASH"

          if [ "$NEW_HASH" = "$STORED_HASH" ] && [ -n "$STORED_HASH" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No content changes detected, skipping commit"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Content changed, will commit"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add static/data/
          git commit -m "chore: update reviews from Booksy"
          git pull --rebase
          git push
