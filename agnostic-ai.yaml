# yaml-language-server: $schema=https://raw.githubusercontent.com/Chemaclass/agnostic-ai/v0.76.0/docs/schemas/config.schema.json
version: 1

targets:
  - claude
  - codex

# Track shared sources; ignore generated native configuration.
gitignore:
  enabled: true

# Fail if a spec cannot be represented by a selected target.
on-unsupported: error

# Codex nested AGENTS.md rules can only scope whole folders; booksy-api targets single files.
outputs:
  codex:
    nested-glob-rules: false
