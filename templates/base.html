<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta Tags -->
    <title>{% block title %}{{ config.title }} - {% if lang == "en" %}Beauty & Wellness Center{% else %}Centro de Belleza y Bienestar{% endif %}{% endblock %}</title>
    <meta name="description" content="{% block description %}{% if lang == 'en' %}Beauty and wellness center in Caravaca de la Cruz, Murcia. Nails, massages and body treatments.{% else %}{{ config.description }}{% endif %}{% endblock %}">
    <meta name="author" content="D'Krisna">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#E8A4B8">

    <!-- Canonical URL -->
    {% if page %}
    <link rel="canonical" href="{{ page.permalink }}">
    {% elif section %}
    <link rel="canonical" href="{{ section.permalink }}">
    {% else %}
    <link rel="canonical" href="{{ config.base_url }}{% if lang == 'en' %}/en/{% else %}/{% endif %}">
    {% endif %}

    <!-- Hreflang for multilingual SEO -->
    {% if page %}
    <link rel="alternate" hreflang="es" href="{{ page.permalink | replace(from='/en/', to='/') }}">
    <link rel="alternate" hreflang="en" href="{% if '/en/' in page.permalink %}{{ page.permalink }}{% else %}{{ page.permalink | replace(from=config.base_url, to=config.base_url ~ '/en') }}{% endif %}">
    {% else %}
    <link rel="alternate" hreflang="es" href="{{ config.base_url }}/">
    <link rel="alternate" hreflang="en" href="{{ config.base_url }}/en/">
    {% endif %}
    <link rel="alternate" hreflang="x-default" href="{{ config.base_url }}/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{% if page %}{{ page.permalink }}{% elif section %}{{ section.permalink }}{% else %}{{ config.base_url }}/{% endif %}">
    <meta property="og:title" content="{% block og_title %}{{ config.title }} - {% if lang == 'en' %}Beauty & Wellness{% else %}Belleza y Bienestar{% endif %}{% endblock %}">
    <meta property="og:description" content="{% block og_description %}{% if lang == 'en' %}Beauty and wellness center in Caravaca de la Cruz, Murcia. Nails, massages and body treatments.{% else %}{{ config.description }}{% endif %}{% endblock %}">
    <meta property="og:image" content="{{ config.base_url }}/images/og-image.webp">
    <meta property="og:image:width" content="1600">
    <meta property="og:image:height" content="1600">
    <meta property="og:image:type" content="image/webp">
    <meta property="og:locale" content="{% if lang == 'en' %}en_US{% else %}es_ES{% endif %}">
    <meta property="og:site_name" content="D'Krisna">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{% if page %}{{ page.permalink }}{% elif section %}{{ section.permalink }}{% else %}{{ config.base_url }}/{% endif %}">
    <meta name="twitter:title" content="{% block twitter_title %}{{ config.title }} - {% if lang == 'en' %}Beauty & Wellness{% else %}Belleza y Bienestar{% endif %}{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}{% if lang == 'en' %}Beauty and wellness center in Caravaca de la Cruz, Murcia. Nails, massages and body treatments.{% else %}{{ config.description }}{% endif %}{% endblock %}">
    <meta name="twitter:image" content="{{ config.base_url }}/images/og-image.webp">

    <!-- Geo tags for local SEO -->
    <meta name="geo.region" content="ES-MU">
    <meta name="geo.placename" content="Caravaca de la Cruz">
    <meta name="geo.position" content="38.105022796540084;-1.851400649856759">
    <meta name="ICBM" content="38.105022796540084, -1.851400649856759">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">

    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://rum.cronitor.io" crossorigin>
    <link rel="preconnect" href="https://www.google.com" crossorigin>
    <link rel="dns-prefetch" href="https://booksy.com">

    <!-- Preload critical assets -->
    {% block preload %}{% endblock %}

    <link rel="stylesheet" href="{{ get_url(path='style.css') }}">

    <!-- JSON-LD Structured Data for LocalBusiness -->
    <script type="application/ld+json">

        "url": "{{ config.base_url }}",
        "telephone": "{{ config.extra.phone }}",
        "email": "{{ config.extra.email }}",
        "address": {
            "@type": "PostalAddress",
            "streetAddress": "Carretera de Murcia N45",
            "addressLocality": "Caravaca de la Cruz",
            "postalCode": "30400",
            "addressRegion": "Murcia",
            "addressCountry": "ES"
        },
        "geo": {

        },

        "image": "{{ config.base_url }}/images/og-image.webp",

                {

                        "@type": "Service",

                    "itemOffered": {

                        "provider": {"@type": "BeautySalon", "name": "D'Krisna"}
                    },

                        "priceCurrency": "EUR",
                        "minPrice": "18.00",
                        "maxPrice": "26.00"
                    }
                },
                {
                    "@type": "Offer",
                    "itemOffered": {
                        "@type": "Service",
                        "name": "{% if lang == 'en' %}Brows & Lashes{% else %}Cejas y Pestañas{% endif %}",
                        "description": "{% if lang == 'en' %}Eyebrow lamination and eyelash extensions{% else %}Laminado de cejas y extensiones de pestañas{% endif %}",
                        "provider": {"@type": "BeautySalon", "name": "D'Krisna"}
                    },

                        "@type": "PriceSpecification",

                        "maxPrice": "18.00"
                    }
                },
                {
                    "@type": "Offer",
                    "itemOffered": {
                        "@type": "Service",
                        "name": "{% if lang == 'en' %}Massages{% else %}Masajes{% endif %}",
                        "description": "{% if lang == 'en' %}Relaxing massages and hot stone therapy{% else %}Masajes relajantes y terapia con piedras calientes{% endif %}",
                        "provider": {"@type": "BeautySalon", "name": "D'Krisna"}
                    },
                    "priceSpecification": {
                        "@type": "PriceSpecification",
                        "price": "30.00",
                        "priceCurrency": "EUR",
                        "minPrice": "30.00",
                        "maxPrice": "40.00"
                    }
                }
            ]
        }
    }
    </script>

    <!-- BreadcrumbList Schema -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
            {
                "@type": "ListItem",
                "position": 1,
                "name": "{% if lang == 'en' %}Home{% else %}Inicio{% endif %}",
                "item": "{{ config.base_url }}{% if lang == 'en' %}/en/{% else %}/{% endif %}"
            }
            {% if page %}
            ,{
                "@type": "ListItem",
                "position": 2,
                "name": "{{ page.title }}",
                "item": "{{ page.permalink }}"
            }
            {% endif %}
        ]
    }
    </script>

    <!-- Cronitor RUM -->
    <script async src="https://rum.cronitor.io/script.js"></script>
    <script>
        window.cronitor = window.cronitor || function() { (window.cronitor.q = window.cronitor.q || []).push(arguments); };
        cronitor('config', { clientKey: 'bc5d599c311ffbf1c74c43f06714bcc6' });
    </script>

    {% block head %}{% endblock %}
</head>
<body>
    {% include "partials/header.html" %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include "partials/footer.html" %}

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.querySelector('.menu-toggle');
            const menuClose = document.querySelector('.menu-close');
            const nav = document.querySelector('.nav');
            const body = document.body;

            // Function to close menu
            function closeMenu() {
                nav.classList.remove('active');
                menuToggle.classList.remove('active');
                body.classList.remove('menu-open');
            }

            // Mobile menu toggle
            if (menuToggle && nav) {
                menuToggle.addEventListener('click', function() {
                    nav.classList.toggle('active');
                    menuToggle.classList.toggle('active');
                    body.classList.toggle('menu-open');
                });

                // Close button click
                if (menuClose) {
                    menuClose.addEventListener('click', closeMenu);
                }

                // Close menu when clicking a link
                nav.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', closeMenu);
                });
            }

            // Smooth scroll for anchor links
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function(e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth' });
                    }
                });
            });

            // Header scroll effect
            const header = document.querySelector('.header');
            let lastScrollY = 0;
            let ticking = false;

            function updateHeader() {
                const currentScrollY = window.scrollY;

                // Scrolled state for shadow
                if (currentScrollY > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }

                // Hide/show on scroll direction (only after scrolling past 100px)
                if (currentScrollY > 100) {
                    if (currentScrollY > lastScrollY) {
                        // Scrolling down
                        header.classList.add('header-hidden');
                    } else {
                        // Scrolling up
                        header.classList.remove('header-hidden');
                    }
                } else {
                    header.classList.remove('header-hidden');
                }

                lastScrollY = currentScrollY;
                ticking = false;
            }

            window.addEventListener('scroll', function() {
                if (!ticking) {
                    requestAnimationFrame(updateHeader);
                    ticking = true;
                }
            });
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
