{% set business_id = config.base_url ~ "/#business" %}
{% set website_id = config.base_url ~ "/#website" %}
{% if page %}
    {% set entity_url = page.permalink %}
    {% set entity_title = page.title %}
{% else %}
    {% set entity_url = section.permalink %}
    {% set entity_title = section.title %}
{% endif %}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@graph": [
        {
            "@type": "BeautySalon",
            "@id": {{ <json value={business_id} /> }},
            "name": {{ <json value={config.title} /> }},
            "alternateName": "D'Krisna Nails",
            "url": {{ <json value={config.base_url ~ "/"} /> }},
            "description": {{ <json value={config.description} /> }},
            "telephone": {{ <json value={config.extra.phone} /> }},
            "email": {{ <json value={config.extra.email} /> }},
            "image": {{ <json value={config.base_url ~ "/images/og-image.webp"} /> }},
            "logo": {{ <json value={config.base_url ~ "/images/logo.webp"} /> }},
            "address": {
                "@type": "PostalAddress",
                "streetAddress": {{ <json value={config.extra.street_address} /> }},
                "addressLocality": {{ <json value={config.extra.city} /> }},
                "postalCode": {{ <json value={config.extra.postal_code} /> }},
                "addressRegion": {{ <json value={config.extra.region} /> }},
                "addressCountry": {{ <json value={config.extra.country} /> }}
            },
            "geo": {
                "@type": "GeoCoordinates",
                "latitude": {{ config.extra.latitude }},
                "longitude": {{ config.extra.longitude }}
            },
            "openingHoursSpecification": [{
                "@type": "OpeningHoursSpecification",
                "dayOfWeek": {{ <json value={config.extra.opening_days} /> }},
                "opens": {{ <json value={config.extra.opening_time} /> }},
                "closes": {{ <json value={config.extra.closing_time} /> }}
            }],
            "sameAs": [
                {{ <json value={config.extra.booksy_url} /> }},
                {{ <json value={config.extra.instagram} /> }},
                {{ <json value={config.extra.facebook} /> }},
                {{ <json value={config.extra.tiktok} /> }}
            ],
            "potentialAction": {
                "@type": "ReserveAction",
                "target": {{ <json value={config.extra.booksy_url} /> }}
            }
        },
        {
            "@type": "WebSite",
            "@id": {{ <json value={website_id} /> }},
            "url": {{ <json value={config.base_url ~ "/"} /> }},
            "name": {{ <json value={config.title} /> }},
            "inLanguage": ["es", "en"],
            "publisher": {"@id": {{ <json value={business_id} /> }}}
        },
        {
            "@type": "WebPage",
            "@id": {{ <json value={entity_url ~ "#webpage"} /> }},
            "url": {{ <json value={entity_url} /> }},
            "name": {{ <json value={entity_title} /> }},
            "inLanguage": {{ <json value={lang} /> }},
            "isPartOf": {"@id": {{ <json value={website_id} /> }}},
            "about": {"@id": {{ <json value={business_id} /> }}}
            {% if page %},
            "breadcrumb": {"@id": {{ <json value={entity_url ~ "#breadcrumb"} /> }}}
            {% endif %}
        }
        {% if page %},
        {
            "@type": "BreadcrumbList",
            "@id": {{ <json value={entity_url ~ "#breadcrumb"} /> }},
            "itemListElement": [
                {
                    "@type": "ListItem", "position": 1,
                    "name": {{ <json value={trans(key="breadcrumb_home", lang=lang)} /> }},
                    "item": {{ <json value={get_url(path="/", lang=lang, trailing_slash=true)} /> }}
                },
                {
                    "@type": "ListItem", "position": 2,
                    "name": {{ <json value={page.title} /> }},
                    "item": {{ <json value={entity_url} /> }}
                }
            ]
        }
        {% endif %}
        {% if page and page.extra.category_filter is defined %}
            {% if lang == "en" %}
                {% set services = load_data(path="static/data/services.en.json") %}
            {% else %}
                {% set services = load_data(path="static/data/services.json") %}
            {% endif %}
            {% for category in services.categories %}
                {% if category.id in page.extra.category_filter %}
                    {% for service in category.services %}
                        {% if service.variantId %},
        {
            "@type": "Service",
            "@id": {{ <json value={entity_url ~ "#service-" ~ service.variantId} /> }},
            "url": {{ <json value={entity_url ~ "#service-" ~ service.variantId} /> }},
            "name": {{ <json value={service.name} /> }},
            {% if service.description %}
            "description": {{ <json value={service.description} /> }},
            {% elif service.variantId == 2659030 %}
            "description": {{ <json value={trans(key="therapeutic_description", lang=lang)} /> }},
            {% endif %}
            "provider": {"@id": {{ <json value={business_id} /> }}},
            "mainEntityOfPage": {"@id": {{ <json value={entity_url ~ "#webpage"} /> }}},
            "offers": {
                "@type": "Offer",
                "url": {{ <json value={config.extra.booksy_url ~ "?do=open-widget&variantId=" ~ service.variantId} /> }},
                "priceCurrency": "EUR",
                "price": {{ <json value={service.price | replace(from=".", to="") | replace(from=",", to=".") | replace(from=" €", to="") | trim} /> }}
            }
        }
                        {% endif %}
                    {% endfor %}
                {% endif %}
            {% endfor %}
        {% endif %}
    ]
}
</script>
