{% set business_id = config.base_url ~ "/#business" %}
{% set website_id = config.base_url ~ "/#website" %}
{% if page %}
    {% set entity_url = page.permalink %}
    {% set entity_title = page.title %}
{% else %}
    {% set entity_url = section.permalink %}
    {% set entity_title = section.title %}
{% endif %}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@graph": [
        {
            "@type": "BeautySalon",
            "@id": {{ json::encode(value=business_id) }},
            "name": {{ json::encode(value=config.title) }},
            "alternateName": "D'Krisna Nails",
            "url": {{ json::encode(value=config.base_url ~ "/") }},
            "description": {{ json::encode(value=config.description) }},
            "telephone": {{ json::encode(value=config.extra.phone) }},
            "email": {{ json::encode(value=config.extra.email) }},
            "image": {{ json::encode(value=config.base_url ~ "/images/og-image.webp") }},
            "logo": {{ json::encode(value=config.base_url ~ "/images/logo.webp") }},
            "address": {
                "@type": "PostalAddress",
                "streetAddress": {{ json::encode(value=config.extra.street_address) }},
                "addressLocality": {{ json::encode(value=config.extra.city) }},
                "postalCode": {{ json::encode(value=config.extra.postal_code) }},
                "addressRegion": {{ json::encode(value=config.extra.region) }},
                "addressCountry": {{ json::encode(value=config.extra.country) }}
            },
            "geo": {
                "@type": "GeoCoordinates",
                "latitude": {{ config.extra.latitude }},
                "longitude": {{ config.extra.longitude }}
            },
            "openingHoursSpecification": [{
                "@type": "OpeningHoursSpecification",
                "dayOfWeek": {{ json::encode(value=config.extra.opening_days) }},
                "opens": {{ json::encode(value=config.extra.opening_time) }},
                "closes": {{ json::encode(value=config.extra.closing_time) }}
            }],
            "sameAs": [
                {{ json::encode(value=config.extra.booksy_url) }},
                {{ json::encode(value=config.extra.instagram) }},
                {{ json::encode(value=config.extra.facebook) }},
                {{ json::encode(value=config.extra.tiktok) }}
            ],
            "potentialAction": {
                "@type": "ReserveAction",
                "target": {{ json::encode(value=config.extra.booksy_url) }}
            }
        },
        {
            "@type": "WebSite",
            "@id": {{ json::encode(value=website_id) }},
            "url": {{ json::encode(value=config.base_url ~ "/") }},
            "name": {{ json::encode(value=config.title) }},
            "inLanguage": ["es", "en"],
            "publisher": {"@id": {{ json::encode(value=business_id) }}}
        },
        {
            "@type": "WebPage",
            "@id": {{ json::encode(value=entity_url ~ "#webpage") }},
            "url": {{ json::encode(value=entity_url) }},
            "name": {{ json::encode(value=entity_title) }},
            "inLanguage": {{ json::encode(value=lang) }},
            "isPartOf": {"@id": {{ json::encode(value=website_id) }}},
            "about": {"@id": {{ json::encode(value=business_id) }}}
            {% if page %},
            "breadcrumb": {"@id": {{ json::encode(value=entity_url ~ "#breadcrumb") }}}
            {% endif %}
        }
        {% if page %},
        {
            "@type": "BreadcrumbList",
            "@id": {{ json::encode(value=entity_url ~ "#breadcrumb") }},
            "itemListElement": [
                {
                    "@type": "ListItem", "position": 1,
                    "name": {{ json::encode(value=trans(key="breadcrumb_home", lang=lang)) }},
                    "item": {{ json::encode(value=get_url(path="/", lang=lang)) }}
                },
                {
                    "@type": "ListItem", "position": 2,
                    "name": {{ json::encode(value=page.title) }},
                    "item": {{ json::encode(value=entity_url) }}
                }
            ]
        }
        {% endif %}
        {% if page and page.extra.category_filter is defined %}
            {% if lang == "en" %}
                {% set services = load_data(path="static/data/services.en.json") %}
            {% else %}
                {% set services = load_data(path="static/data/services.json") %}
            {% endif %}
            {% for category in services.categories %}
                {% if category.id in page.extra.category_filter %}
                    {% for service in category.services %}
                        {% if service.variantId %},
        {
            "@type": "Service",
            "@id": {{ json::encode(value=entity_url ~ "#service-" ~ service.variantId) }},
            "url": {{ json::encode(value=entity_url ~ "#service-" ~ service.variantId) }},
            "name": {{ json::encode(value=service.name) }},
            {% if service.description %}
            "description": {{ json::encode(value=service.description) }},
            {% elif service.variantId == 2659030 %}
            "description": {{ json::encode(value=trans(key="therapeutic_description", lang=lang)) }},
            {% endif %}
            "provider": {"@id": {{ json::encode(value=business_id) }}},
            "mainEntityOfPage": {"@id": {{ json::encode(value=entity_url ~ "#webpage") }}},
            "offers": {
                "@type": "Offer",
                "url": {{ json::encode(value=config.extra.booksy_url ~ "?do=open-widget&variantId=" ~ service.variantId) }},
                "priceCurrency": "EUR",
                "price": {{ json::encode(value=service.price | replace(from=".", to="") | replace(from=",", to=".") | replace(from=" €", to="") | trim) }}
            }
        }
                        {% endif %}
                    {% endfor %}
                {% endif %}
            {% endfor %}
        {% endif %}
    ]
}
</script>
